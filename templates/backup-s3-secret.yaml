{{- if and .Values.supabase.backup.enabled .Values.supabase.backup.s3.enabled }}
{{- if not .Values.supabase.backup.s3.secretRef }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-backup-s3-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-backup
    app.kubernetes.io/component: backup
type: Opaque
data:
  AWS_ACCESS_KEY_ID: {{ .Values.supabase.backup.s3.accessKeyId | b64enc }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.supabase.backup.s3.secretAccessKey | b64enc }}
{{- end }}
{{- end }}

# Example values for production Supabase deployment
# Copy this file and customize for your environment

supabase:
  enabled: true
  
  # CRITICAL: Generate new JWT keys for production!
  # Use: https://supabase.com/docs/guides/self-hosting/docker#generate-api-keys
  secret:
    jwt:
      # Example keys - DO NOT USE IN PRODUCTION
      anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
      serviceKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
      secret: "super-secret-jwt-token-with-at-least-32-characters-long"
    
    db:
      username: "postgres"
      password: "your-super-secure-and-unique-password"
      database: "postgres"
    
    # SendGrid SMTP example
    smtp:
      username: "apikey"
      password: "SG.your-sendgrid-api-key"
    
    # Optional: Dashboard protection
    dashboard:
      username: "admin@yourdomain.com"
      password: "your-dashboard-password"
    
    analytics:
      apiKey: "your-logflare-api-key"

  # Production domain configuration
  studio:
    environment:
      STUDIO_DEFAULT_ORGANIZATION: "Your Organization"
      STUDIO_DEFAULT_PROJECT: "Production"
      SUPABASE_PUBLIC_URL: "https://api.yourdomain.com"

  auth:
    environment:
      API_EXTERNAL_URL: "https://api.yourdomain.com"
      GOTRUE_SITE_URL: "https://app.yourdomain.com"
      # SendGrid configuration
      GOTRUE_SMTP_HOST: "smtp.sendgrid.net"
      GOTRUE_SMTP_PORT: "587"
      GOTRUE_SMTP_ADMIN_EMAIL: "admin@yourdomain.com"
      GOTRUE_SMTP_SENDER_NAME: "noreply@yourdomain.com"
      # Security settings
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: true

  # Production ingress with TLS
  kong:
    ingress:
      enabled: true
      className: "nginx"
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
        kubernetes.io/tls-acme: "true"
        # Rate limiting
        nginx.ingress.kubernetes.io/limit-rps: "100"
        # Proxy body size for file uploads
        nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      tls:
        - secretName: supabase-tls
          hosts:
            - api.yourdomain.com
      hosts:
        - host: api.yourdomain.com
          paths:
            - path: /
              pathType: Prefix

  # Database persistence
  db:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: "fast-ssd"  # Use your fast storage class
    
    # Resource allocation
    resources:
      requests:
        memory: "2Gi"
        cpu: "1000m"
      limits:
        memory: "4Gi"
        cpu: "2000m"

  # Storage configuration
  storage:
    persistence:
      enabled: true
      size: 100Gi
      storageClass: "standard"
    
    environment:
      FILE_SIZE_LIMIT: "104857600"  # 100MB
      
      # S3 backend example (recommended for production)
      # STORAGE_BACKEND: "s3"
      # GLOBAL_S3_BUCKET: "your-supabase-storage"
      # GLOBAL_S3_ENDPOINT: "https://s3.amazonaws.com"
      # GLOBAL_S3_REGION: "us-east-1"
      # AWS_DEFAULT_REGION: "us-east-1"
    
    # S3 credentials in secret
    # s3:
    #   keyId: "your-aws-access-key"
    #   accessKey: "your-aws-secret-key"

  # High availability settings
  auth:
    replicaCount: 2
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"

  rest:
    replicaCount: 3
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"

  realtime:
    replicaCount: 2
    environment:
      # Generate a new secret!
      SECRET_KEY_BASE: "EAx3IQ/wRG1v47ZD4NE4/9RzCI8gCHL4WW7M3SS99I7GmVqVKBWcw3x8KlCEBabq"
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"

  # Backup configuration
  backup:
    enabled: true
    schedule: "0 2 * * *"  # 2 AM daily
    retentionDays: 30
    storage:
      size: 100Gi
      storageClass: "standard"
    
    # S3 backup for disaster recovery
    s3:
      enabled: true
      schedule: "0 4 * * *"  # 4 AM daily
      bucket: "your-backup-bucket"
      prefix: "supabase-backups/prod"
      region: "us-east-1"
      accessKeyId: "your-backup-access-key"
      secretAccessKey: "your-backup-secret-key"

  # Analytics with BigQuery (optional)
  analytics:
    bigQuery:
      enabled: false
      projectId: "your-gcp-project"
      datasetId: "supabase_analytics"
      # Mount GCP service account JSON
      # gcloudJson: |
      #   {
      #     "type": "service_account",
      #     ...
      #   }

  # Vector logging to external system
  vector:
    enabled: true
    # Ship logs to Elasticsearch/Loki/etc
    config: |
      [sources.kubernetes_logs]
      type = "kubernetes_logs"
      
      [sinks.elasticsearch]
      type = "elasticsearch"
      inputs = ["kubernetes_logs"]
      endpoint = "https://your-elasticsearch:9200"
      
# External database example (for HA)
# externalDatabase:
#   host: "your-rds-instance.amazonaws.com"
#   port: 5432
#   database: "postgres"
#   username: "postgres"
#   password: "your-external-db-password"
#   
# # Then disable built-in database:
# supabase:
#   db:
#     enabled: false
#   
#   # Update all services to use external DB
#   auth:
#     environment:
#       DB_HOST: "your-rds-instance.amazonaws.com"